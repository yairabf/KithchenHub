name: Refresh iOS Match profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-ios-match-profile:
    name: Refresh App Store provisioning profile
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "Missing ASC_KEY_ID"; exit 1; fi
          if [ -z "$ASC_ISSUER_ID" ]; then echo "Missing ASC_ISSUER_ID"; exit 1; fi
          if [ -z "$ASC_KEY_P8" ]; then echo "Missing ASC_KEY_P8"; exit 1; fi
          if [ -z "$MATCH_PASSWORD" ]; then echo "Missing MATCH_PASSWORD"; exit 1; fi
          if [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then echo "Missing MATCH_GIT_BASIC_AUTHORIZATION"; exit 1; fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: mobile

      - name: Write App Store Connect API key JSON
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          key_json_path = Path(os.environ['RUNNER_TEMP']) / 'AuthKey.json'
          key_json_path.write_text(json.dumps({
              'key_id': os.environ['ASC_KEY_ID'],
              'issuer_id': os.environ['ASC_ISSUER_ID'],
              'key': os.environ['ASC_KEY_P8'],
              'duration': 1200,
              'in_house': False,
          }))
          key_json_path.chmod(0o600)
          PY

      - name: Force-refresh App Store Match profile
        env:
          ASC_KEY_JSON_PATH: ${{ runner.temp }}/AuthKey.json
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          bundle exec fastlane match appstore \
            --app_identifier com.kitchenhub.app \
            --team_id UT62KQGZDJ \
            --api_key_path "$ASC_KEY_JSON_PATH" \
            --force true \
            --readonly false
