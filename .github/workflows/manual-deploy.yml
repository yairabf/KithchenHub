# Unified manual deploy workflow:
# - Optional backend redeploy to Vercel via Deploy Hook.
# - Optional mobile build-only validation.
# - Optional mobile store delivery via Fastlane reusable workflow.

name: Manual deploy

on:
  workflow_dispatch:
    inputs:
      redeploy_backend_vercel:
        description: "Re-trigger backend deploy on Vercel (latest main via Deploy Hook)"
        type: boolean
        default: false
      mobile_build_only:
        description: "Mobile: build-only (archive iOS + Android AAB), no store uploads"
        type: boolean
        default: false
      ios_testflight:
        description: "Mobile: run iOS internal (TestFlight)"
        type: boolean
        default: false
      ios_app_store_submit:
        description: "Mobile: after TestFlight, submit for App Store review (fastlane ios prod)"
        type: boolean
        default: false
      android_play_internal:
        description: "Mobile: run Android internal (Play internal track)"
        type: boolean
        default: false
      android_production_promote:
        description: "Mobile: after internal track, promote to production draft (fastlane android prod)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  redeploy-vercel:
    name: Redeploy backend on Vercel
    if: ${{ inputs.redeploy_backend_vercel }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "Missing required secret: VERCEL_DEPLOY_HOOK_URL"
            exit 1
          fi
          echo "Triggering Vercel deploy hook..."
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

  # --- Build-only path (no uploads, fast iteration) ---
  ios-build-check:
    name: iOS build check (archive only)
    if: ${{ inputs.mobile_build_only }}
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: mobile

      - name: Install npm dependencies
        run: npm ci

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Generate native iOS project (Expo prebuild)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Fastlane iOS archive (build only, no TestFlight upload)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane ios build_check

      - name: Upload gym build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-build-log
          path: ~/Library/Logs/gym/
          retention-days: 5

  android-build-check:
    name: Android build check (AAB only)
    if: ${{ inputs.mobile_build_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Write keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Generate native Android project (Expo prebuild)
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Increase Gradle JVM memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" \
            >> android/gradle.properties

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true
          working-directory: mobile

      - name: Fastlane Android AAB build (no Play upload)
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: bundle exec fastlane android build_check

  # --- Store delivery path (uploads to stores) ---
  stores:
    if: ${{ !inputs.mobile_build_only && (inputs.ios_testflight || inputs.android_play_internal || inputs.ios_app_store_submit || inputs.android_production_promote) }}
    uses: ./.github/workflows/mobile-native-store-release.yml
    secrets: inherit
    with:
      ios_app_store_submit: ${{ inputs.ios_app_store_submit }}
      android_production_promote: ${{ inputs.android_production_promote }}
